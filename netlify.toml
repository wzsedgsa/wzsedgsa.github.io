# Copied to the public artifact repository as netlify.toml. No second Hexo build.
[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"
